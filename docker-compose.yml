services:
  postgres:
    image: postgres:16-alpine
    container_name: ud-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-uduser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-udpassword}
      POSTGRES_DB: ${POSTGRES_DB:-universal_downloader}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-uduser}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ud-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.server
    container_name: ud-server
    restart: unless-stopped
    ports:
      - "${SERVER_PORT:-3001}:3001"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-uduser}:${POSTGRES_PASSWORD:-udpassword}@postgres:5432/${POSTGRES_DB:-universal_downloader}
      REDIS_URL: redis://redis:6379
      PYTHON_SERVICE_URL: http://python-service:8001
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  python-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: ud-python
    restart: unless-stopped
    ports:
      - "${PYTHON_PORT:-8001}:8001"
    environment:
      PYTHON_ENV: production
      DOWNLOAD_DIR: /app/downloads
      YT_DLP_PATH: /usr/local/bin/yt-dlp
      FFMPEG_PATH: /usr/local/bin/ffmpeg
    volumes:
      - downloads_data:/app/downloads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  client:
    build:
      context: .
      dockerfile: docker/Dockerfile.client
    container_name: ud-client
    restart: unless-stopped
    depends_on:
      - server

  nginx:
    image: nginx:alpine
    container_name: ud-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server
      - client

volumes:
  postgres_data:
  redis_data:
  downloads_data:
